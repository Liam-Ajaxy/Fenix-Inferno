<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testing</title>
</head>

<style>
    * {
        margin: 5px;
    }
    body {
        background: url('jeremy-bishop-8xznAGy4HcY-unsplash.jpg');
        background-repeat: no-repeat;
        background-size: cover;
        max-width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        
    }
    .spin {
        padding: 2rem;
        width: 20%;
        height: 15%;
        border: 1px solid wheat;
        border-radius: 1rem;
        background: rgba(0, 0, 0, 0.123);
    }
    input {
        background-color: rgba(0, 0, 0, 0.265);
        color: wheat;
        padding: 0.2rem 2rem;
        border-radius: 2rem;
        border: none;
    }
    ::placeholder {
        color: black;
    }
    p {
        color: wheat;
    }
/* Spinner added to any button */
    .button-spinner {
      width: 16px;
      height: 16px;
      margin-left: 8px;
      border: 2px solid white;
      border-top: 2px solid transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: inline-block;
      vertical-align: middle;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    button {
        color: wheat;
        padding: 0.5rem 6rem;
        border-radius: 2rem;
        background: black;
        border: none;
        cursor: pointer;
    }
    button:hover{
        background: rgba(0, 0, 0, 0.872);
        color: white;
    }

    .spinning {
        width: 15px;
        height: 15px;
        position: absolute;
        border: solid wheat;
        border-top-color: black;
        border-radius: 50%;
        animation: spin 500ms linear infinite;
    }
    @keyframes spin {
        to {transform: rotate(360deg);}
    }

    .teaser {
        display: none;
    }
</style>
<body>
    <div class="spin tea">
        <h2>CRUD</h2>
        <p>Practice spinning button Great UI</p>
        <input type="text" name="text" id="names" placeholder="Enter you names" required>
        <input type="email" name="email" id="email" placeholder="Enter your email" required>
        <button onclick="submit()" class="btn-spin">Submit</button>
        <p id="results">Users</p>
    </div>

    <script>
        function submit() {
            const names = document.getElementById('names').value.trim();
            const email = document.getElementById('email').value.trim();
            const results = document.getElementById('results');
            const spin = document.querySelector('.btn-spin');
            
            if (spin) {
            spin.innerHTML = `
            <span>Generating </span>
            <span class="button-spinner"></span>
            `;
            }
           

            setTimeout(() => {
            results.innerHTML += `
            <h4>${names}</h4>
            <h5>${email}</h5>
            <button onclick="edit()">Edit</button>
            <button onclick="delete()">Delete</button>
            `;

            }, 3000);

            console.log(`Submit trigerred. User: ${names}, ${email}`);
        }
        
    </script>
</body>
</html>
