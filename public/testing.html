<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Signal Trace + AI Threat Monitor</title>
  <style>
    body {
      background-color: black;
      color: #00ff00;
      font-family: monospace;
      padding: 20px;
      user-select: none;
    }
    #terminal {
      white-space: pre-wrap;
      line-height: 1.4em;
    }
    .log-line {
      display: block;
    }
    .flicker {
      animation: flicker 0.2s infinite alternate;
    }
    @keyframes flicker {
      0% { opacity: 1; }
      100% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div id="terminal"></div>

  <script>
    const terminal = document.getElementById('terminal');

    const lines = [
      "↪ [TRACE] Initiating signal tunnel handshake...",
      "↪ [NODE-01] Relay secured | Latency: 18ms",
      "↪ [NODE-02] Signal jump complete | Latency: 27ms",
      "↪ [NODE-03] Ping deviation detected | Re-routing...",
      "↪ [NODE-04] Established | Encrypted AES-4096",
      "↪ [AI-MODULE] Anomaly scanner engaged...",
      "↪ [THREATSCAN] Monitoring packets...",
      "↪ [ECHO LOOP] Signal reflection pattern detected",
      "↪ [ALERT] Suspicious MAC address detected: DC:A6:32:44...",
      "↪ [THREAT RATING] Evolving...",
      "↪ [THREAT RATING] CRITICAL LEVEL RAISED",
      "↪ [RESPONSE] Auto-containment activated...",
      "↪ [CONFIRM] AI Response sealed threat vectors.",
      "↪ [LOGOUT] Signal trace terminated. Session locked."
    ];

    const dynamicLines = {
      9: ["↪ [THREAT RATING] Low...", "↪ [THREAT RATING] Medium...", "↪ [THREAT RATING] CRITICAL LEVEL RAISED"],
      5: ["↪ [AI-MODULE] Scanning headers...", "↪ [AI-MODULE] Analyzing entropy...", "↪ [AI-MODULE] Anomaly scanner engaged..."],
      7: ["↪ [ECHO LOOP] Trace repeating...", "↪ [ECHO LOOP] Signal reflection pattern detected", "↪ [ECHO LOOP] Confirmed ghost echo"]
    };

    let i = 0;

    function printLine(index) {
      const line = document.createElement('span');
      line.className = 'log-line';
      line.textContent = lines[index];
      terminal.appendChild(line);

      // Animate content swap if it's a dynamic line
      if (dynamicLines[index]) {
        let variant = 1;
        const swaps = dynamicLines[index];
        const updateInterval = setInterval(() => {
          if (variant >= swaps.length) return clearInterval(updateInterval);
          line.textContent = swaps[variant];
          variant++;
        }, 1000 + Math.random() * 800);
      }

      terminal.scrollTop = terminal.scrollHeight;
    }

    function startSimulation() {
      if (i < lines.length) {
        printLine(i);
        i++;
        setTimeout(startSimulation, 500 + Math.random() * 1000);
      }
    }

    startSimulation();
  </script>
</body>
</html>
