<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FENIX Logo Draw Fill Animation</title>
  <style>
    body {
      margin: 0;
      background: #0a1e40;
      font-family: sans-serif;
    }

    header {
      display: flex;
      align-items: center;
      padding: 12px 24px;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 42px;
      height: 42px;
      background: white;
      border-radius: 50%;
    }

    svg {
      height: 40px;
      width: auto;
    }

    .draw path,
    .draw rect {
      fill: none;
      stroke: white;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;

      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: draw 1.2s ease forwards;
    }

    .draw path:nth-of-type(1) { animation-delay: 0s; }
    .draw path:nth-of-type(2) { animation-delay: 0.4s; }
    .draw path:nth-of-type(3) { animation-delay: 0.8s; }
    .draw rect              { animation-delay: 1.2s; }
    .draw path:nth-of-type(4) { animation-delay: 1.6s; }

    @keyframes draw {
      to {
        stroke-dashoffset: 0;
      }
    }

    .fill path,
    .fill rect {
      fill: white;
      opacity: 0;
      animation: fadeIn 0.2s ease forwards;
    }

    .fill path:nth-of-type(1) { animation-delay: 1.2s; }
    .fill path:nth-of-type(2) { animation-delay: 1.6s; }
    .fill path:nth-of-type(3) { animation-delay: 2s; }
    .fill rect              { animation-delay: 2.4s; }
    .fill path:nth-of-type(4) { animation-delay: 2.8s; }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }
  </style>
</head>
<body>

<header>
  <div class="logo-container">
    <div class="logo-icon"></div>

    <svg viewBox="0 0 700 120" xmlns="http://www.w3.org/2000/svg" aria-label="Fenix Logo Wordmark" role="img">
      <!-- DRAW STROKE LAYER -->
      <g class="draw">
        <path d="M10 110 L10 20 L70 20 L70 35 L25 35 L25 60 L60 60 L60 75 L25 75 L25 110 Z" />
        <path d="M90 20 L155 20 Q160 20 160 25 L160 30 Q160 35 155 35 L115 35 L115 55 L150 55 Q155 55 155 60 L155 65 Q155 70 150 70 L115 70 L115 95 L155 95 Q160 95 160 100 L160 105 Q160 110 155 110 L90 110 Z" />
        <path d="M180 110 L180 20 L200 20 L250 95 L250 20 L270 20 L270 110 L250 110 L200 35 L200 110 Z" />
        <rect x="300" y="20" width="20" height="90" rx="2" ry="2" />
        <path d="M340 20 L375 65 L410 20 L430 20 L385 75 L430 110 L410 110 L375 75 L340 110 L320 110 L365 65 L320 20 Z" />
      </g>

      <!-- FILL LAYER -->
      <g class="fill">
        <path d="M10 110 L10 20 L70 20 L70 35 L25 35 L25 60 L60 60 L60 75 L25 75 L25 110 Z" />
        <path d="M90 20 L155 20 Q160 20 160 25 L160 30 Q160 35 155 35 L115 35 L115 55 L150 55 Q155 55 155 60 L155 65 Q155 70 150 70 L115 70 L115 95 L155 95 Q160 95 160 100 L160 105 Q160 110 155 110 L90 110 Z" />
        <path d="M180 110 L180 20 L200 20 L250 95 L250 20 L270 20 L270 110 L250 110 L200 35 L200 110 Z" />
        <rect x="300" y="20" width="20" height="90" rx="2" ry="2" />
        <path d="M340 20 L375 65 L410 20 L430 20 L385 75 L430 110 L410 110 L375 75 L340 110 L320 110 L365 65 L320 20 Z" />
      </g>
    </svg>
  </div>
</header>

</body>
</html>
