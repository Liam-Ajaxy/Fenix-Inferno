<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>practical JS</title>
</head>
<style>
  body {
    background: black;
    color: rgb(184, 247, 255);
    height: 100vh;
    max-height: 120vh;
    max-width: 98%;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .cont {
    background: linear-gradient(to right, rgba(0, 0, 255, 0.05), rgba(3, 40, 45, 0.379), rgba(0, 0, 255, 0.059));
    padding: 2rem;
    border-radius: 1rem;
  }
  .subcont {
    background: linear-gradient(90deg, rgba(0, 217, 255, 0.03), rgba(0, 0, 255, 0.066), rgba(179, 245, 255, 0.071));
    padding: 2rem;
  }
  h2 {
    font-size: 60;
  }
  p {
    font-size: 20;
  }
  span {
    color: orangered;
  }
  .inputcont {
    padding: 1rem;
  }
  .inputcont input {
    background: black;
    padding: 1rem;
    border: none;
    border-radius: 1rem;
    width: 100%;
    color: green;
  }
  button {
    width: 100%;
    background: green;
    border: none;
    border-radius: 2rem;
    padding: 0.4rem;
    cursor: pointer;
    color: white;
    font-size: medium;
    font-weight: 800;
  }
  button:hover {
    animation: background 3s linear infinite;
    transition: background 4s ease-in-out;
    border: solid white;
  }
  ::placeholder {
    color: green;
    font-size: medium;
    font-family: monospace;
  }
  @keyframes background {
    from {
      background: linear-gradient(90deg, rgba(0, 217, 255, 0.03), rgba(0, 0, 255, 0.066), rgba(179, 245, 255, 0.071));
    }
    to {
      background: transparent;
    }
  }
  #message, #error {
    font-size: smaller;
    font-family: monospace;
  }
  #message {
    color: orange;
  }
  #error {
    color: red;
  }
</style>
<body>
  <div class="cont">
    <div class="subcont">
      <h2>Practical JS</h2>
        <p>Hello, <span id="name"></span> You are Welcome to the JS practice.</p>
    </div>
    <h5>Time: <p id="clock1"></p></h5>
    <div class="inputcont">
      <input type="text" id="username" placeholder="What's your username?"><br><br>
      <input type="number" id="age" placeholder="What's your age"><br>
      <p id="message"></p><br>
      <p>You are ready to go! Enter your password to confirm.</p>
      <input type="password" id="password" placeholder="Enter your password"><br><br>
      <button onclick="submit()">Submit</button>
      <p id="error"></p>
    </div>
  </div>
  <script>
      const hrs = document.getElementById('hrs');
      const min = document.getElementById('min');
      const sec = document.getElementById('sec');

  const now = new Date();
  const hours = now.getHours().toString().padStart(2, '0');
  const mins = now.getMinutes().toString().padStart(2, '0');
  document.getElementById("clock1").textContent = `${hours}:${mins}`;


    function submit() {
      const name = document.getElementById('name');
      const enteredName = document.getElementById('username').value.trim();
      const enteredAge = document.getElementById('age').value.trim();
      const msg = document.getElementById('message');
      const enteredPassword = document.getElementById('password').value.trim();
      const error = document.getElementById('error');

      const password = "1234";
      const username = "Frank Admin";

      if (enteredName === username && enteredPassword === password) {
        name.innerHTML = `${enteredName}!`;
      }
      if (enteredAge <= 18) {
        msg.innerHTML = "You are minor!"
      }
      else {
        error.innerHTML = "Invalid username or password!";
      }
    }


  </script>
</body>
</html>
