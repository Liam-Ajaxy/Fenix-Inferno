<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FENIX Elite Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      --primary: #6366f1;
      --dark: #111827;
      --light: #f9fafb;
      --error: #ef4444;
      --white: #fff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: var(--bg-gradient);
      color: var(--light);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .container {
      display: flex;
      width: 100%;
      max-width: 100%;
      border-radius: 1.5rem;
      overflow: hidden;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
      background-color: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
    }

    .left-panel {
      flex: 1;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      position: relative;
    }

    /* iPhone mockup container */
    .phone-mockup {
      width: 280px;
      height: 560px;
      border: 16px solid #111;
      border-radius: 40px;
      box-shadow:
        0 0 15px rgba(0,0,0,0.5),
        inset 0 0 15px rgba(255,255,255,0.1);
      background: #000;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .phone-mockup::before {
      content: '';
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 7px;
      background: #222;
      border-radius: 5px;
      z-index: 10;
      box-shadow: 0 12px 0 #222;
    }

    /* Video fills the screen */
    .phone-mockup video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 24px;
      pointer-events: none;
      user-select: none;
    }

    .right-panel {
      flex: 1;
      background-color: rgba(255, 255, 255, 0.1);
      padding: 3rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      color: var(--white);
    }

    .logo {
      text-align: center;
      margin-bottom: 1rem;
    }

    .logo img {
      width: 60px;
    }

    .right-panel h2 {
      font-size: 2rem;
      text-align: center;
      margin-bottom: 2rem;
    }

    .form-group {
      position: relative;
      margin-bottom: 1.75rem;
      width: 100%;
    }

    .form-group input {
      width: 100%;
      padding: 1rem;
      border-radius: 0.75rem;
      border: 1px solid #ccc;
      background: rgba(255,255,255,0.1);
      color: var(--white);
      font-size: 1rem;
    }

    .form-group label {
      position: absolute;
      left: 1rem;
      top: 1rem;
      color: #cbd5e1;
      transition: 0.2s ease;
      pointer-events: none;
    }

    .form-group input:focus + label,
    .form-group input:not(:placeholder-shown) + label {
      top: -0.75rem;
      left: 0.75rem;
      font-size: 0.75rem;
      background: var(--dark);
      padding: 0 0.25rem;
      color: var(--primary);
      font-weight: 600;
    }

    .btn {
      background: var(--primary);
      border: none;
      padding: 0.9rem;
      width: 100%;
      border-radius: 0.75rem;
      font-size: 1rem;
      font-weight: bold;
      color: var(--white);
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .btn:hover {
      background: #4f46e5;
    }

    .separator {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 1.5rem 0;
      color: #bbb;
    }

    .separator::before,
    .separator::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #999;
    }

    .separator:not(:empty)::before {
      margin-right: 0.75em;
    }

    .separator:not(:empty)::after {
      margin-left: 0.75em;
    }

    .social-buttons button {
      background: rgba(255,255,255,0.15);
      border: 1px solid #666;
      color: #fff;
      padding: 0.75rem;
      width: 100%;
      border-radius: 0.75rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      justify-content: center;
      margin-bottom: 0.75rem;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .social-buttons button:hover {
      transform: scale(1.03);
    }

    .social-buttons img {
      width: 20px;
      height: 20px;
    }

    @media(max-width: 768px) {
      .container {
        flex-direction: column;
        margin: 1rem;
      }
      .left-panel {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="left-panel">
      <div class="phone-mockup" aria-label="Phone preview with FENIX app login screen">
        <video autoplay muted loop playsinline>
          <!-- Replace this src with your actual FENIX login demo video -->
          <source src="22 Miles.mp4" type="video/mp4" />
          Your browser does not support the video tag.
        </video>
      </div>
    </div>
    <div class="right-panel">
      <div class="logo">
        <img src="fenixLogoOfficial.png" alt="FENIX Logo">
      </div>
      <h2>Login to FENIX</h2>
      <form id="login-form">
        <div class="form-group">
          <input type="email" id="login-email" placeholder=" " required>
          <label for="login-email">Email</label>
        </div>
        <div class="form-group">
          <input type="password" id="login-password" placeholder=" " required>
          <label for="login-password">Password</label>
        </div>
        <button type="submit" class="btn btn-spin">Login</button>
        <div class="separator">OR</div>
        <div class="social-buttons">
          <button type="button"><img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg" alt="Google">Continue with Google</button>
          <button type="button"><img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/windows8/windows8-original.svg" alt="Microsoft">Continue with Microsoft</button>
          <button type="button"><img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/apple/apple-original.svg" alt="Apple">Continue with Apple</button>
        </div>
        <a href="signup.html" style="display:block;text-align:center;color:var(--primary);margin-top:1rem;text-decoration:none;font-weight:600">Don't have an account? Sign Up</a>
      </form>
    </div>
  </div>

  <script src="account.js"></script>
  <script src="login-popup.js"></script>
</body>
</html>
