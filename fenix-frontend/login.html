<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | FENIX</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #00f0ff, #4f72ff, #ff4d6d);
      color: #4f46e5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .login-box {
      background: #fff;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 360px;
    }
    .login-box h2 {
      margin-bottom: 1.5rem;
      color: #4f46e5;
      font-size: 1.5rem;
    }
    .login-box input {
      width: 100%;
      padding: 0.75rem 0.1rem;
      margin-bottom: 1rem;
      border: 1px solid #333;
      border-radius: 0.5rem;
      background: #ffffff;
      color: #4f46e5;
    }
    .login-box button {
      width: 100%;
      padding: 0.75rem;
      background: linear-gradient(135deg, #00f0ff, #4f72ff, #ff4d6d);
      border: none;
      border-radius: 0.5rem;
      font-weight: bold;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }
    .login-box button:hover {
      background: linear-gradient(135deg, #00eeffcd, #4f72ffc7, #ff4d6ec1);
    }
    .login-box a {
      color: #4f46e5;
      text-decoration: none;
      font-size: 0.9rem;
      display: block;
      text-align: center;
      margin-top: 1rem;
    }
    img { 
      max-width: 20%; 
      display: block; 
      border-radius: 0.75rem; 
    }
  </style>
</head>
<body>
  <div class="login-box">
        <div class="logo">
    <img src="fenixLogoOfficial.png">
   </div>
    <h2>Login to FENIX</h2>
     <form id="login-form">
  <input type="email" id="login-email" placeholder="Email" required />
  <input type="password" id="login-password" placeholder="Password" required />
  <button type="submit">Login</button>
  <a href="signup.html">Don't have an account? Sign Up</a>
</form>
  </div>

  <script src="account.js"></script>
</body>
</html>
